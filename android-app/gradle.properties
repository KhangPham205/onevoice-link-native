# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=false
org.gradle.workers.max=1
# Enable Build Cache
org.gradle.caching=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Compile Kotlin inside the bounded Gradle process. A separate 2 GiB Kotlin
# daemon previously made a one-module debug build exhaust this laptop's RAM.
kotlin.compiler.execution.strategy=in-process

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=false

# Runtime routing A/B configuration. Override per build with -P<name>=<value>.
# Confidence values are natural-log probability per emitted ASR token.
routingMode=DUAL_ASR
# Provisional, fit on 21 on-device synthetic VI/EN fixtures with Parakeet-110M
# CTC as the EN branch (2026-10-22): 0 misroutes/0 first-turn rejections.
# Re-tune from real speakers' OneVoiceRouting rows.
dualAsrMarginThreshold=0.15
dualAsrFloorThreshold=-5.0
# Added to the EN normalized score: CTC peak scores run closer to zero than
# the VI RNN-T's, even on Vietnamese speech.
dualAsrEnOffset=-0.08
# Below the margin, the turn prior shifts the VI-EN score difference by this many
# nats/token instead of overriding it. >= dualAsrMarginThreshold = old hard prior.
dualAsrPriorWeight=0.15
# Kokoro ORT intra-op threads. Measured on SM8550 (18 routed fixtures each):
# 2 -> TTS RTF median 1.20; 4 -> 0.83; 5 -> 0.81. 4 keeps the A510s free.
kokoroThreads=4
# Per-frame speech detector for live capture: SILERO (neural, bundled asset) or
# ENERGY (legacy RMS gate). Silero falls back to ENERGY if its asset fails to load.
vadMode=SILERO
# Vietnamese target speech: VIENEU (VieNeu-TTS v3 Nano, sea-g2p phonemes),
# KOKORO (espeak-ng vi, aliased token table) or SUPERTONIC (Supertonic-3 int8,
# reads Vietnamese graphemes; 44.1 kHz resampled to 24 kHz). On the 91 EN->VI
# dataset turns VieNeu had Whisper round-trip WER 1.8% (Kokoro 6.4%, Supertonic
# 5.3%) and first-audio p50 3.06 s (4.30 s, 4.22 s) at Kokoro-level memory.
# VIENEU needs libsea_g2p_rs.so (tools/models/build-sea-g2p-android.sh).
# Supertonic: voice F1..F5/M1..M5; steps = flow-matching denoising steps.
viTtsEngine=VIENEU
supertonicVoice=F1
supertonicSteps=5
# Divides the predicted duration. 1.0 left slack Supertonic filled with
# repeated words (round-trip CER 4.9%); 1.15 -> 0.76%, 1.25 -> 1.97% (skips).
supertonicSpeed=1.15
supertonicThreads=4
# VIENEU (VieNeu-TTS v3 Nano, Apache-2.0): SDK defaults, 16 Euler steps with
# classifier-free guidance 3.0. The seed fixes the flow noise so a render is
# reproducible (the SDK draws fresh noise per call).
vieneuVoice=minh_quan
vieneuSteps=16
vieneuCfg=3.0
vieneuSpeed=1.0
vieneuThreads=4
vieneuSeed=1234
# Long turns (docs/LONG_FORM_SPEECH_IMPLEMENTATION.md). LEGACY: one ASR window
# per turn, the 10 s ceiling closes the mic. ADAPTIVE: capture continues across
# windows, chunks are recognized/translated while the speaker talks, playback
# starts after the turn ends. ADAPTIVE is the default since 2026-11-05;
# -PlongTurnMode=LEGACY rolls back with one rebuild.
longTurnMode=ADAPTIVE
# Provisional starting values, not measured optima (spec section 5.1).
longTurnSoftSplitMs=7000
longTurnMicroPauseMs=160
longTurnOverlapMs=960
longTurnMaxTurnS=120
