<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090" role="img" aria-labelledby="t d">
  <title id="t">OneVoice Link on-device architecture</title>
  <desc id="d">Audio from the phone or USB-C microphone is bounded by Silero VAD, scored by Vietnamese and English ASR in parallel, routed by a dual-ASR confidence router, translated by MarianMT on the Hexagon NPU, synthesized by CPU TTS and played back. All inference runs on the phone. Development tools sit outside the device boundary.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#fff}
      .dev{fill:#f8fafc;stroke:#0f172a;stroke-width:3}
      .npu{fill:#f3e8ff;stroke:#7e22ce;stroke-width:2.4}
      .cpu{fill:#ecfeff;stroke:#0e7490;stroke-width:2.4}
      .io{fill:#f1f5f9;stroke:#475569;stroke-width:2.2}
      .grp{fill:#fff;stroke:#94a3b8;stroke-width:1.6}
      .fb{fill:#fffbeb;stroke:#b45309;stroke-width:2.2;stroke-dasharray:8 5}
      .off{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;stroke-dasharray:8 5}
      .f{fill:none;stroke:#334155;stroke-width:2.6;marker-end:url(#a)}
      .h1{font:700 28px Arial,sans-serif;fill:#0f172a}
      .sub{font:400 17px Arial,sans-serif;fill:#334155}
      .cap{font:700 15px Arial,sans-serif;fill:#0f172a;letter-spacing:1px}
      .b{font:700 18px Arial,sans-serif;fill:#0f172a}
      .t{font:400 15px Arial,sans-serif;fill:#1e293b}
      .s{font:400 13.5px Arial,sans-serif;fill:#475569}
      .tagn{font:700 12px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1500" height="1090"/>

  <text class="h1" x="30" y="44">OneVoice Link — on-device speech-to-speech translation (VI ↔ EN)</text>
  <text class="sub" x="30" y="72">Samsung Galaxy Z Flip5 · Snapdragon 8 Gen 2 (SM8550, Hexagon v73 HTP) · Android 16 · APK declares no INTERNET permission</text>

  <!-- legend -->
  <rect class="npu" x="30" y="90" width="22" height="16" rx="3"/><text class="t" x="60" y="104">NPU (Hexagon HTP, QNN)</text>
  <rect class="cpu" x="250" y="90" width="22" height="16" rx="3"/><text class="t" x="280" y="104">CPU (Kryo, arm64)</text>
  <rect class="io" x="430" y="90" width="22" height="16" rx="3"/><text class="t" x="460" y="104">Audio I/O</text>
  <rect class="fb" x="560" y="90" width="22" height="16" rx="3"/><text class="t" x="590" y="104">Fallback (cold, CPU)</text>
  <rect class="off" x="760" y="90" width="22" height="16" rx="3"/><text class="t" x="790" y="104">Off-device, development only</text>

  <!-- device boundary -->
  <rect class="dev" x="20" y="125" width="1460" height="780" rx="14"/>
  <text class="cap" x="40" y="152">DEVICE BOUNDARY — ALL DEMO INFERENCE RUNS ON THE PHONE, IN AIRPLANE MODE, WITH NO API OR CLOUD CALLS</text>

  <!-- Row 1 -->
  <rect class="io" x="45" y="215" width="200" height="170" rx="10"/>
  <text class="b" x="60" y="245">Microphone</text>
  <text class="t" x="60" y="272">Phone mic or USB-C</text>
  <text class="t" x="60" y="292">mic (user selects)</text>
  <text class="t" x="60" y="318">16 kHz mono PCM</text>
  <text class="s" x="60" y="345">one speaker at a time</text>

  <rect class="cpu" x="280" y="215" width="225" height="170" rx="10"/>
  <text class="b" x="295" y="245">Capture + VAD</text>
  <text class="t" x="295" y="272">AudioRecord</text>
  <text class="t" x="295" y="292">Silero VAD (ONNX)</text>
  <text class="t" x="295" y="318">turn end: 1 s silence</text>
  <text class="s" x="295" y="345">10 s ASR windows;</text>
  <text class="s" x="295" y="364">turns up to 120 s</text>

  <rect class="cpu" x="540" y="215" width="225" height="170" rx="10"/>
  <text class="b" x="555" y="245">ASR front-ends</text>
  <text class="t" x="555" y="272">native C++ via JNI</text>
  <text class="t" x="555" y="292">VI: Kaldi fbank</text>
  <text class="t" x="555" y="312">EN: NeMo log-mel</text>
  <text class="s" x="555" y="345">[1, 1000, 80] each</text>

  <!-- Dual ASR group -->
  <rect class="grp" x="800" y="168" width="660" height="290" rx="10"/>
  <text class="cap" x="815" y="192">DUAL ASR — BOTH BRANCHES SCORE EVERY TURN, IN PARALLEL</text>

  <rect class="npu" x="815" y="205" width="330" height="115" rx="8"/>
  <text class="b" x="828" y="230">GIPFormer-65M encoder (VI)</text>
  <text class="t" x="828" y="254">Zipformer RNN-T · QNN context</text>
  <text class="t" x="828" y="274">built with QAIRT 2.45</text>
  <text class="s" x="828" y="298">FP32 I/O · FP16 compute on HTP</text>
  <rect class="cpu" x="1160" y="205" width="285" height="115" rx="8"/>
  <text class="b" x="1173" y="230">RNN-T decoder + joiner</text>
  <text class="t" x="1173" y="254">ONNX Runtime 1.20, FP32</text>
  <text class="t" x="1173" y="274">greedy (default)</text>
  <text class="s" x="1173" y="298">optional beam + term bias list</text>

  <rect class="npu" x="815" y="333" width="330" height="115" rx="8"/>
  <text class="b" x="828" y="358">Parakeet-TDT-CTC-110M (EN)</text>
  <text class="t" x="828" y="382">CTC head · QNN context</text>
  <text class="t" x="828" y="402">built with QAIRT 2.40</text>
  <text class="s" x="828" y="426">quantized · UFIXED_16 I/O</text>
  <rect class="cpu" x="1160" y="333" width="285" height="115" rx="8"/>
  <text class="b" x="1173" y="358">Greedy CTC decode</text>
  <text class="t" x="1173" y="382">token text +</text>
  <text class="t" x="1173" y="402">log-prob per token</text>

  <path class="f" d="M245 300 H276"/>
  <path class="f" d="M505 300 H536"/>
  <path class="f" d="M765 280 H811"/>
  <path class="f" d="M765 320 L790 320 L790 390 H811"/>
  <path class="f" d="M1145 262 H1156"/>
  <path class="f" d="M1145 390 H1156"/>

  <!-- ASR -> router -->
  <path class="f" d="M1130 458 V490 H170 V526"/>

  <!-- Row 2 -->
  <rect class="cpu" x="45" y="530" width="260" height="180" rx="10"/>
  <text class="b" x="60" y="560">Dual-ASR router</text>
  <text class="t" x="60" y="587">compares mean log-prob</text>
  <text class="t" x="60" y="607">per token, coverage,</text>
  <text class="t" x="60" y="627">soft turn prior</text>
  <text class="s" x="60" y="660">→ VI→EN, EN→VI,</text>
  <text class="s" x="60" y="679">or reject (fail closed)</text>

  <rect class="npu" x="345" y="530" width="345" height="180" rx="10"/>
  <text class="b" x="360" y="560">MarianMT (opus-mt)</text>
  <text class="t" x="360" y="587">vi-en and en-vi directions</text>
  <text class="t" x="360" y="607">encoder + decoder per direction</text>
  <text class="t" x="360" y="627">QNN contexts, QAIRT 2.45</text>
  <text class="s" x="360" y="660">FP32 I/O · FP16 compute on HTP</text>
  <text class="s" x="360" y="679">token-by-token loop driven from CPU</text>

  <rect class="cpu" x="730" y="530" width="400" height="180" rx="10"/>
  <text class="b" x="745" y="560">Speech synthesis (whole utterance)</text>
  <text class="t" x="745" y="587">EN: Kokoro-82M</text>
  <text class="s" x="745" y="606">sherpa-onnx 1.13.4, FP32</text>
  <text class="t" x="745" y="632">VI: VieNeu-TTS v3 Nano + sea-g2p</text>
  <text class="s" x="745" y="651">ONNX Runtime 1.20, FP32, 16 flow steps</text>
  <text class="s" x="745" y="679">24 kHz mono, 4 threads</text>

  <rect class="io" x="1170" y="530" width="290" height="180" rx="10"/>
  <text class="b" x="1185" y="560">Translated output</text>
  <text class="t" x="1185" y="587">AudioTrack, stereo 24 kHz</text>
  <text class="t" x="1185" y="607">loudspeaker, or A2DP</text>
  <text class="t" x="1185" y="627">headset (VI left, EN right)</text>
  <text class="s" x="1185" y="660">+ source text and translation</text>
  <text class="s" x="1185" y="679">shown on screen</text>

  <path class="f" d="M305 620 H341"/>
  <path class="f" d="M690 620 H726"/>
  <path class="f" d="M1130 620 H1166"/>

  <!-- Row 3 -->
  <rect class="npu" x="45" y="745" width="645" height="140" rx="10"/>
  <text class="b" x="60" y="775">Qualcomm QAIRT / QNN HTP runtime 2.47.0 (packaged in the APK)</text>
  <text class="t" x="60" y="802">libQnnHtp.so loaded with dlopen · unsigned Hexagon v73 skeleton over FastRPC</text>
  <text class="t" x="60" y="824">6 context binaries resident: 2 ASR encoders + 2 × (MT encoder, MT decoder)</text>
  <text class="s" x="60" y="850">Every load checks binary info (socModel 43), creates the context on HTP</text>
  <text class="s" x="60" y="869">and retrieves the graph by name; initialization fails if any of the six is missing</text>

  <rect class="fb" x="730" y="745" width="730" height="140" rx="10"/>
  <text class="b" x="745" y="775">Fallback: cold CPU recovery, whole utterance</text>
  <text class="t" x="745" y="802">If the selected NPU translation path fails, ASR + MT re-run on CPU from the</text>
  <text class="t" x="745" y="824">original audio (sherpa-onnx ASR, ONNX Runtime Marian). NPU and CPU output are never mixed.</text>
  <text class="s" x="745" y="850">If either ASR branch fails, or neither score passes the routing floor, the turn</text>
  <text class="s" x="745" y="869">is rejected rather than guessed. Half-duplex: the mic stays closed during playback.</text>

  <!-- off device -->
  <rect class="off" x="20" y="925" width="1460" height="150" rx="12"/>
  <text class="cap" x="40" y="953">OFF-DEVICE — DEVELOPMENT ONLY, NOT PART OF THE SUBMITTED RUNTIME</text>
  <text class="t" x="40" y="982">• Qualcomm AI Hub (cloud): compiled GIPFormer and MarianMT from ONNX into QNN context binaries for SM8550</text>
  <text class="t" x="40" y="1006">• sherpa-onnx: prebuilt SM8550 QNN binary for Parakeet · Python tools: manifest generator, bias-list compiler, evaluation and scoring</text>
  <text class="t" x="40" y="1030">• adb over USB: staging models into app-private storage and collecting logs. Binaries are copied to the phone once and loaded locally.</text>
  <text class="s" x="40" y="1056">Models are staged separately from the APK (about 1.7 GB); nothing is downloaded at run time.</text>
</svg>
