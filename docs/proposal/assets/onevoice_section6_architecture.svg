  <text class="title" x="45" y="40">OneVoice Link — dual-ASR Hybrid, half-duplex, no Auracast</text>

  <rect class="implemented" x="1030" y="17" width="23" height="19" rx="4"/>
  <text class="legend" x="1062" y="32">Implemented</text>
  <rect class="experiment" x="1155" y="17" width="23" height="19" rx="4"/>
  <text class="legend" x="1187" y="32">Conditional / planned</text>
  <rect class="blocked" x="1300" y="17" width="23" height="19" rx="4"/>
  <text class="legend" x="1332" y="32">Excluded</text>
  <rect class="hardware" x="1410" y="17" width="23" height="19" rx="4"/>
  <text class="legend" x="1442" y="32">Hardware</text>

  <!-- Build-time preparation -->
  <rect class="build-region" x="40" y="65" width="1520" height="175" rx="18"/>
  <text class="region-title" x="65" y="95">Build and validation — network allowed only before deployment; inference is fully offline</text>

