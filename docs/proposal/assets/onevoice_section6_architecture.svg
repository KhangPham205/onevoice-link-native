  <text class="box-text" x="285" y="951">Marian encoder + decoder on HTP</text>
  <text class="box-text" x="285" y="973">CPU Kokoro English · whole utterance</text>

  <rect class="implemented" x="585" y="900" width="430" height="90" rx="12"/>
  <text class="box-title" x="800" y="928">Confirmed A2DP stereo playback</text>
  <text class="box-text" x="800" y="951">poll AudioTrack.getRoutedDevice() before content</text>
  <text class="box-text" x="800" y="973">Vietnamese = LEFT · English = RIGHT</text>

  <rect class="implemented" x="1100" y="900" width="430" height="90" rx="12"/>
  <text class="box-title" x="1315" y="928">Selected EN → VI branch</text>
  <text class="box-text" x="1315" y="951">Marian encoder + decoder on HTP</text>
  <text class="box-text" x="1315" y="973">CPU Kokoro Vietnamese · whole utterance</text>

  <path class="flow" d="M 680 875 L 680 885 L 285 885 L 285 900"/>
  <path class="flow" d="M 920 875 L 920 885 L 1315 885 L 1315 900"/>
  <path class="flow" d="M 500 945 L 585 945"/>
  <path class="flow" d="M 1100 945 L 1015 945"/>

  <!-- Feasibility decision -->
  <rect class="decision-region" x="40" y="1040" width="1520" height="175" rx="18"/>
  <text class="region-title" x="65" y="1070">Auracast feasibility decision — excluded from the competition runtime</text>

  <rect class="blocked" x="70" y="1090" width="315" height="90" rx="12"/>
  <text class="box-title" x="227" y="1118">Standards boundary</text>
  <text class="box-text" x="227" y="1142">one-way broadcast downlink</text>
  <text class="box-text" x="227" y="1164">no microphone uplink or speaker identity</text>

  <rect class="blocked" x="415" y="1090" width="300" height="90" rx="12"/>
  <text class="box-title" x="565" y="1118">Platform and ecosystem</text>
  <text class="box-text" x="565" y="1142">only one Bluetooth mic captured at once</text>
  <text class="box-text" x="565" y="1164">no suitable industrial Auracast headset verified</text>

  <rect class="blocked" x="745" y="1090" width="300" height="90" rx="12"/>
  <text class="box-title" x="895" y="1118">Application control</text>
  <text class="box-text" x="895" y="1142">broadcast source APIs may require</text>
  <text class="box-text" x="895" y="1164">OEM / privileged system access</text>

  <rect class="experiment" x="1075" y="1080" width="450" height="110" rx="12"/>
  <text class="box-title" x="1300" y="1108">Conditional device-identity probe</text>
  <text class="box-text" x="1300" y="1132">distinct headset mic → getRoutedDevice() → VI / EN map</text>
  <text class="box-text" x="1300" y="1154">valid only if Android exposes a stable, switchable endpoint</text>
  <text class="warning" x="1300" y="1177">A shared TWS pair exposes one mic endpoint — use dual ASR</text>

  <text class="small" x="70" y="1204">Solid arrows: runtime data flow · purple dashed: HTP dispatch · gray dashed: state/control flow. SpeechFlow remains build-time A/B only.</text>
</svg>
