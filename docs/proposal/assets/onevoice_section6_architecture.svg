  <path class="flow" d="M 940 289 L 965 289"/>
  <rect class="hardware" x="970" y="274" width="125" height="30" rx="15"/>
  <text class="state" x="1032" y="294">CAPTURING</text>
  <path class="flow" d="M 1095 289 L 1120 289"/>
  <rect class="neutral" x="1125" y="274" width="130" height="30" rx="15"/>
  <text class="state" x="1190" y="294">PROCESSING</text>
  <path class="flow" d="M 1255 289 L 1280 289"/>
  <rect class="implemented" x="1285" y="274" width="110" height="30" rx="15"/>
  <text class="state" x="1340" y="294">PLAYING</text>
  <path class="control" d="M 1395 289 L 1430 289 L 1430 258 L 895 258 L 895 274"/>

  <!-- Capture row -->
  <rect class="hardware" x="70" y="330" width="220" height="100" rx="12"/>
  <text class="box-title" x="180" y="359">Shared Bluetooth TWS mic</text>
  <text class="box-text" x="180" y="383">one Android input endpoint</text>
  <text class="box-text" x="180" y="405">16 kHz mono · one speaker at a time</text>

  <rect class="implemented" x="325" y="330" width="250" height="100" rx="12"/>
  <text class="box-title" x="450" y="359">Verified SCO input route</text>
  <text class="box-text" x="450" y="383">setCommunicationDevice()</text>
  <text class="box-text" x="450" y="405">AudioRecord.getRoutedDevice()</text>

  <rect class="implemented" x="610" y="330" width="245" height="100" rx="12"/>
  <text class="box-title" x="732" y="359">AudioRecord + VAD</text>
  <text class="box-text" x="732" y="383">VOICE_COMMUNICATION · PCM16</text>
  <text class="box-text" x="732" y="405">20 ms · pre-roll · end silence</text>

  <rect class="implemented" x="890" y="330" width="245" height="100" rx="12"/>
  <text class="box-title" x="1012" y="359">Bounded utterance</text>
  <text class="box-text" x="1012" y="383">queue capacity = 1 · max 10 s</text>
  <text class="box-text" x="1012" y="405">no capture/playback overlap</text>

  <rect class="implemented" x="1170" y="330" width="345" height="100" rx="12"/>
  <text class="box-title" x="1342" y="359">Close communication path</text>
  <text class="box-text" x="1342" y="383">stop + release AudioRecord</text>
  <text class="box-text" x="1342" y="405">clearCommunicationDevice() before inference</text>

  <path class="flow" d="M 290 380 L 325 380"/>
  <path class="flow" d="M 575 380 L 610 380"/>
  <path class="flow" d="M 855 380 L 890 380"/>
  <path class="flow" d="M 1135 380 L 1170 380"/>

  <!-- Shared frontend -->
  <rect class="implemented" x="330" y="465" width="420" height="82" rx="12"/>
  <text class="badge" x="540" y="486">CPU · COMPUTED ONCE PER UTTERANCE</text>
  <text class="box-title" x="540" y="511">Shared Kaldi-style ASR frontend</text>
  <text class="box-text" x="540" y="534">one immutable FP32 tensor [1,1000,80] · duplicate buffer views</text>

  <rect class="experiment" x="850" y="465" width="420" height="82" rx="12"/>
  <text class="badge" x="1060" y="486">PLANNED · OFFLINE · VERSIONED</text>
  <text class="box-title" x="1060" y="511">Specialist vocabulary database</text>
  <text class="box-text" x="1060" y="534">active domain → VI / EN token bias list for ASR decoding</text>

  <path class="flow" d="M 1342 430 L 1342 448 L 540 448 L 540 465"/>

  <!-- Dual ASR -->
