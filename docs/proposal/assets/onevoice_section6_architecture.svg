  <text class="box-title" x="530" y="674">Decoder + joiner + bias hook</text>
  <text class="box-text" x="530" y="699">optional bias list → VI text · raw / mean logP</text>

  <rect class="branch" x="890" y="585" width="640" height="170" rx="15"/>
  <text class="branch-title" x="915" y="614">English ASR candidate</text>

  <rect class="implemented" x="920" y="630" width="250" height="95" rx="12"/>
  <text class="badge" x="1045" y="650">HEXAGON HTP</text>
  <text class="box-title" x="1045" y="674">Zipformer-small encoder</text>
  <text class="box-text" x="1045" y="699">graph_shbblv7u → [1,248,512]</text>

  <rect class="implemented" x="1205" y="630" width="300" height="95" rx="12"/>
  <text class="badge" x="1355" y="650">CPU RNN-T HOST</text>
  <text class="box-title" x="1355" y="674">Decoder + joiner + bias hook</text>
  <text class="box-text" x="1355" y="699">optional bias list → EN text · raw / mean logP</text>

  <path class="accel" d="M 540 547 L 540 560 L 220 560 L 220 630"/>
  <path class="accel" d="M 540 547 L 540 560 L 1045 560 L 1045 630"/>
  <path class="control" d="M 1060 547 L 1060 575 L 530 575 L 530 630"/>
  <path class="control" d="M 1060 547 L 1060 575 L 1355 575 L 1355 630"/>
  <path class="flow" d="M 345 677 L 380 677"/>
  <path class="flow" d="M 1170 677 L 1205 677"/>

  <!-- Confidence router -->
  <rect class="implemented" x="560" y="785" width="480" height="90" rx="12"/>
  <text class="box-title" x="800" y="813">Dual-ASR confidence router</text>
  <text class="box-text" x="800" y="838">floor → normalized margin → opposite-turn prior</text>
  <text class="box-text" x="800" y="859">low confidence / missing first-turn prior → fail closed</text>
  <path class="flow" d="M 530 725 L 530 770 L 690 770 L 690 785"/>
  <path class="flow" d="M 1355 725 L 1355 770 L 910 770 L 910 785"/>

  <!-- Selected target branches and playback -->
  <rect class="implemented" x="70" y="900" width="430" height="90" rx="12"/>
