<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">OneVoice Link dual-ASR Hybrid architecture without Auracast</title>
  <desc id="desc">Current offline architecture for a shared Bluetooth TWS pair. Android captures one Bluetooth microphone at a time. A shared feature matrix feeds Vietnamese and English ASR branches. A planned offline specialist-vocabulary database supplies bias lists at RNN-T decoding time. Confidence routing selects the translation direction, and half-duplex playback sends Vietnamese to the left stereo channel or English to the right. Auracast is excluded because it is a one-way broadcast without a microphone uplink. Device-identity routing through getRoutedDevice remains only a conditional experiment for distinct routable headsets.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e22ce"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .region { fill: #f8fafc; stroke: #475569; stroke-width: 2.5; }
      .build-region { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .decision-region { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.4; }
      .implemented { fill: #ecfdf5; stroke: #15803d; stroke-width: 2.4; }
      .experiment { fill: #fffbeb; stroke: #ca8a04; stroke-width: 2.4; stroke-dasharray: 8 5; }
      .blocked { fill: #fff1f2; stroke: #be123c; stroke-width: 2.4; }
      .external { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.4; }
      .hardware { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2.4; }
      .neutral { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.2; }
      .branch { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .control { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .accel { fill: none; stroke: #7e22ce; stroke-width: 2.4; stroke-dasharray: 7 5; marker-end: url(#arrow-purple); }
      .title { font: 700 29px Arial, sans-serif; fill: #0f172a; }
      .region-title { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .branch-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .box-text { font: 13.5px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .legend { font: 13.5px Arial, sans-serif; fill: #334155; }
      .badge { font: 700 11px Arial, sans-serif; fill: #475569; text-anchor: middle; letter-spacing: 0.4px; }
      .state { font: 700 13px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .warning { font: 700 13.5px Arial, sans-serif; fill: #9f1239; text-anchor: middle; }
    </style>
  </defs>

