  <text class="box-title" x="220" y="674">GIPFormer encoder</text>
  <text class="box-text" x="220" y="699">graph_oa00nu3e → [1,248,512]</text>

  <rect class="implemented" x="380" y="630" width="300" height="95" rx="12"/>
