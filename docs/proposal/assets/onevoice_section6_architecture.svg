  <text class="box-title" x="212" y="143">Model sources</text>
  <text class="box-text" x="212" y="168">GIPFormer · Zipformer · Opus-MT</text>
  <text class="box-text" x="212" y="190">Kokoro packs · specialist terminology corpus</text>

  <rect class="external" x="395" y="115" width="300" height="95" rx="12"/>
  <text class="box-title" x="545" y="143">CPU host artifacts</text>
  <text class="box-text" x="545" y="168">RNN-T decoder + joiner ONNX</text>
  <text class="box-text" x="545" y="190">Kokoro · tokenizers · voices</text>

  <rect class="external" x="740" y="105" width="340" height="115" rx="12"/>
  <text class="box-title" x="910" y="134">Qualcomm AI Hub / QAIRT</text>
  <text class="box-text" x="910" y="159">compile for SM8550 · Hexagon HTP v73</text>
  <text class="box-text" x="910" y="181">2 ASR encoders + 4 Marian contexts</text>
  <text class="box-text" x="910" y="203">inspect exact graph and tensor contracts</text>

  <rect class="external" x="1125" y="105" width="385" height="115" rx="12"/>
  <text class="box-title" x="1317" y="134">Validated deployment package</text>
  <text class="box-text" x="1317" y="159">manifest: graph · tensors · size · socModel</text>
  <text class="box-text" x="1317" y="181">SHA-256 direction packs + versioned bias lists</text>
  <text class="box-text" x="1317" y="203">atomic app-private deployment</text>

  <path class="flow" d="M 350 162 L 395 162"/>
  <path class="flow" d="M 695 162 L 740 162"/>
  <path class="flow" d="M 1080 162 L 1125 162"/>

  <!-- Current runtime -->
  <rect class="region" x="40" y="260" width="1520" height="760" rx="18"/>
  <text class="region-title" x="65" y="292">Current offline runtime — dual-ASR Hybrid with strict half-duplex audio</text>

  <rect class="neutral" x="850" y="274" width="90" height="30" rx="15"/>
